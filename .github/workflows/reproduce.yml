name: Validate release, reproduce tables and test models
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r environment/requirements-validated.lock.txt
      - run: python scripts/verify_release.py
      - run: python scripts/reproduce_tables.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-figures-tables
          path: artifacts/
